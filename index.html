<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Quest Generator</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0f0f0f;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container {
    width:90%;
    max-width:600px;
    text-align:center;
}

.card {
    background:#1c1c1c;
    padding:22px;
    border-radius:15px;
    margin:20px 0;
    min-height:200px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    line-height:1.5;
    white-space:pre-wrap;
}

button {
    width:100%;
    padding:15px;
    margin:8px 0;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

.generate { background:#00c853; color:white; }
.complete { background:#2979ff; color:white; }

.small {
    opacity:0.7;
    font-size:13px;
}
</style>
</head>

<body>

<div class="container">
    <h1>Life Quest Generator</h1>

    <div class="card" id="challenge">Press generate</div>

    <button class="generate" onclick="generate()">Generate Quest</button>
    <button class="complete" onclick="complete()">Complete Quest</button>

    <p>Streak: <span id="streak">0</span></p>
    <p>Total: <span id="total">0</span></p>
</div>

<script>

// ================= STATE =================

let streak = parseInt(localStorage.getItem("streak") || "0");
let total = parseInt(localStorage.getItem("total") || "0");
let history = JSON.parse(localStorage.getItem("history") || "[]");
let currentMission = null;

document.getElementById("streak").innerText = streak;
document.getElementById("total").innerText = total;

// ================= HELPERS =================

function pick(arr){
    return arr[Math.floor(Math.random() * arr.length)];
}

// ================= BUILDING BLOCKS =================

const objects = [
"cardboard", "paper", "plastic cups", "books", "chairs", "tape",
"cushions", "clothes", "kitchen items", "string", "boxes"
];

const themes = [
"space", "zombies", "time travel", "survival", "ancient civilisation",
"future city", "pirates", "secret agent", "sports league", "AI world"
];

const skills = [
"handstand", "cartwheel", "L-sit", "crow pose", "basic juggling",
"basic sign language", "simple magic trick", "memory technique",
"coin trick", "balance drill"
];

const foods = [
"pasta", "rice bowl", "sandwich", "wrap", "stir fry", "omelette",
"protein meal", "breakfast bowl", "smoothie bowl"
];

const ingredients = [
"something spicy", "something you’ve never cooked with",
"only 5 ingredients", "a protein you rarely eat",
"a random supermarket item"
];

const moneyIdeas = [
"find 5 items to sell online",
"create a simple digital product idea",
"list a micro service you could sell",
"research a side hustle for 20 minutes",
"find undervalued items locally"
];

// ================= MISSION GENERATORS =================

const generators = [

() => ({
title: "DIY BUILD MISSION",
category: "Creative Build",
difficulty: "Medium",
duration: "1–2 Hours",
mission: `Build a functioning structure using ${pick(objects)}.

It must be:
- Stable
- Purposeful (not just random stacking)
- Tested 3 times`,
requirements: ["Stable structure", "Functional use", "3 tests"]
}),

() => ({
title: "FITNESS SKILL MISSION",
category: "Fitness",
difficulty: "Medium",
duration: "30–60 mins",
mission: `Learn and practise a physical skill:

Choose ONE:
- ${pick(skills)}
- Try a harder variation if already known

Rules:
- 30 minutes minimum practice
- Must show improvement (even small)`,
requirements: ["30 min practice", "skill attempt", "progress shown"]
}),

() => ({
title: "FOOD CREATION MISSION",
category: "Cooking",
difficulty: "Easy–Medium",
duration: "45–90 mins",
mission: `Create a meal from scratch.

Rules:
- Base: ${pick(foods)}
- Must include: ${pick(ingredients)}
- Must be something you've never made before

Then rate it out of 10.`,
requirements: ["Cook from scratch", "New variation", "Taste rating"]
}),

() => ({
title: "WEIRD INVENTION MISSION",
category: "Weird Creativity",
difficulty: "Easy",
duration: "30–60 mins",
mission: `Invent something completely new:

- A new sport
- OR a new game
- OR a new rule system for daily life

Theme: ${pick(themes)}

You must:
- Name it
- Explain rules
- Test it once`,
requirements: ["Create invention", "Name it", "Test once"]
}),

() => ({
title: "SKILL LEARNING MISSION",
category: "Skill Building",
difficulty: "Medium",
duration: "45–90 mins",
mission: `Learn a new practical skill:

Today’s focus:
- ${pick(skills)}

Rules:
- 45 minutes focused practice
- Must be able to demonstrate basic ability`,
requirements: ["45 min practice", "basic competency"]
}),

() => ({
title: "MAKE MONEY THINKING MISSION",
category: "Business",
difficulty: "Easy",
duration: "20–40 mins",
mission: `Spend time building a money idea:

Task:
- ${pick(moneyIdeas)}

Output must be written down clearly:
- What it is
- How it would make money
- First step to start it`,
requirements: ["Idea created", "Monetisation plan", "Next step"]
})

];

// 90% tangible outcome bias (duplicate weight for build/skill)
const weightedGenerators = [
generators[0], generators[0], generators[0], // build
generators[1], generators[1], // fitness
generators[2], generators[2], // food
generators[3], // weird
generators[4], generators[4], // skill
generators[5] // money
];

// ================= GENERATE =================

function generate(){

    let mission;

    for(let i = 0; i < 30; i++){
        const gen = pick(weightedGenerators);
        mission = gen();

        if(!history.includes(mission.title + mission.mission)) break;
    }

    history.push(mission.title + mission.mission);

    if(history.length > 300) history.shift();

    localStorage.setItem("history", JSON.stringify(history));

    currentMission = mission;

    document.getElementById("challenge").innerText =
`${mission.title}

Category: ${mission.category}
Difficulty: ${mission.difficulty}
Duration: ${mission.duration}

Mission:
${mission.mission}

Requirements:
- ${mission.requirements.join("\n- ")}`;
}

// ================= COMPLETE =================

function complete(){

    total++;
    localStorage.setItem("total", total);

    let last = localStorage.getItem("last");
    let today = new Date().toDateString();

    if(last !== today){
        streak++;
        localStorage.setItem("streak", streak);
        localStorage.setItem("last", today);
    }

    document.getElementById("streak").innerText = streak;
    document.getElementById("total").innerText = total;
}

</script>

</body>
</html>
