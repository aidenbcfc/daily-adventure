<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Daily Adventure</title>

<link rel="manifest" href="manifest.json">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 90%;
    max-width: 500px;
    text-align: center;
}

.card {
    background: #1c1c1c;
    padding: 20px;
    border-radius: 15px;
    margin: 20px 0;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    line-height: 1.4;
}

button {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

.generate { background: #00c853; color: white; }
.complete { background: #2979ff; color: white; }
</style>
</head>

<body>

<div class="container">
    <h1>Daily Adventure</h1>

    <div class="card" id="challenge">Press generate</div>

    <button class="generate" onclick="generate()">Generate</button>
    <button class="complete" onclick="complete()">Complete</button>

    <p>Streak: <span id="streak">0</span></p>
    <p>Total: <span id="total">0</span></p>
</div>

<script>

// ===================== CLEAN MISSION SYSTEM =====================

const missions = [
  "Walk to a place nearby you have never properly explored",
  "Start a short conversation with a shop worker and ask a question",
  "Take a 10–15 minute walk without checking your phone",
  "Find a café you’ve never been inside and go in",
  "Write down 3 ideas to improve your daily routine",
  "Compliment someone you encounter naturally today",
  "Sit somewhere new for 10 minutes and observe your surroundings",
  "Take a different route than usual when going outside",
  "Ask a stranger for a simple recommendation (food, place, or activity)",
  "Spend 10 minutes cleaning or organising a small area",
  "Write a list of things you want to improve in your life",
  "Go outside and notice 5 things you’ve never paid attention to before",
  "Walk to a park or public space and just sit for a while",
  "Talk to someone you usually wouldn’t talk to",
  "Do something productive you’ve been avoiding for less than 20 minutes",
  "Find a quiet place and think about your goals for 10 minutes",
  "Go into a shop you never go into and browse for 5 minutes",
  "Take 5 photos of interesting things around you",
  "Spend 10 minutes learning something new on your phone",
  "Do a small act of kindness for someone today"
];

// ===================== NON-REPEAT SYSTEM =====================

let usedMissions = JSON.parse(localStorage.getItem("usedMissions")) || [];

function generate() {

    if (usedMissions.length >= missions.length) {
        usedMissions = [];
    }

    let available = missions.filter(m => !usedMissions.includes(m));

    let mission = available[Math.floor(Math.random() * available.length)];

    usedMissions.push(mission);
    localStorage.setItem("usedMissions", JSON.stringify(usedMissions));

    current = mission;

    document.getElementById("challenge").innerText = current;
}

// ===================== STATE =====================

let current = null;

let streak = localStorage.getItem("streak") || 0;
let total = localStorage.getItem("total") || 0;

document.getElementById("streak").innerText = streak;
document.getElementById("total").innerText = total;

// ===================== COMPLETE =====================

function complete(){
    if(!current) return;

    total++;
    localStorage.setItem("total", total);

    let last = localStorage.getItem("last");
    let today = new Date().toDateString();

    if(last !== today){
        streak++;
        localStorage.setItem("streak", streak);
        localStorage.setItem("last", today);
    }

    document.getElementById("total").innerText = total;
    document.getElementById("streak").innerText = streak;

    current = null;
    document.getElementById("challenge").innerText = "Completed!";
}

// ===================== SERVICE WORKER =====================

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}

</script>

</body>
</html>
