<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Daily Adventure</title>

<link rel="manifest" href="manifest.json">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 90%;
    max-width: 500px;
    text-align: center;
}

.card {
    background: #1c1c1c;
    padding: 20px;
    border-radius: 15px;
    margin: 20px 0;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    line-height: 1.4;
}

button {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

.generate { background: #00c853; color: white; }
.complete { background: #2979ff; color: white; }
</style>
</head>

<body>

<div class="container">
    <h1>Daily Adventure</h1>

    <div class="card" id="challenge">Press generate</div>

    <button class="generate" onclick="generate()">Generate</button>
    <button class="complete" onclick="complete()">Complete</button>

    <p>Streak: <span id="streak">0</span></p>
    <p>Total: <span id="total">0</span></p>
</div>

<script>

// ===================== DATA (SCALABLE SYSTEM) =====================

const actions = {
  exploration: [
    "Explore", "Discover", "Visit", "Walk to", "Find", "Navigate to"
  ],
  social: [
    "Talk to", "Interview", "Ask", "Meet", "Approach", "Observe"
  ],
  creation: [
    "Create", "Design", "Build", "Invent", "Plan", "Draft"
  ]
};

const subjects = {
  exploration: [
    "a hidden street", "a local park", "a viewpoint", "a landmark",
    "a canal path", "a bridge", "a quiet road", "a nearby area",
    "a place you've never noticed", "a random direction walk"
  ],

  social: [
    "a stranger", "a shop worker", "a café staff member",
    "someone you’ve never spoken to", "a local resident",
    "a person with an interesting job"
  ],

  creation: [
    "a small idea", "a quick plan", "a simple concept",
    "a life improvement idea", "a mini project concept",
    "a habit you could start today"
  ]
};

const constraints = [
  "within 10 minutes",
  "within 30 minutes",
  "within 1 hour",
  "walking only",
  "no transport allowed",
  "use only your phone",
  "stay within 1 mile",
  "go in a random direction",
  "do it immediately",
  "before going home"
];

// ===================== CORE ENGINE =====================

function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function getCategory() {
    return pick(Object.keys(actions));
}

function generate() {

    const category = getCategory();

    const action = pick(actions[category]);
    const subject = pick(subjects[category]);
    const constraint = pick(constraints);

    current = `${action} ${subject} ${constraint}`;

    document.getElementById("challenge").innerText = current;
}

// ===================== STATE =====================

let current = null;

let streak = localStorage.getItem("streak") || 0;
let total = localStorage.getItem("total") || 0;

document.getElementById("streak").innerText = streak;
document.getElementById("total").innerText = total;

// ===================== COMPLETE =====================

function complete(){
    if(!current) return;

    total++;
    localStorage.setItem("total", total);

    let last = localStorage.getItem("last");
    let today = new Date().toDateString();

    if(last !== today){
        streak++;
        localStorage.setItem("streak", streak);
        localStorage.setItem("last", today);
    }

    document.getElementById("total").innerText = total;
    document.getElementById("streak").innerText = streak;

    current = null;
    document.getElementById("challenge").innerText = "Completed!";
}

// ===================== SERVICE WORKER =====================

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}

</script>

</body>
</html>
