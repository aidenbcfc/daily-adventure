<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Life RPG</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 90%;
    max-width: 500px;
    text-align: center;
}

.card {
    background: #1c1c1c;
    padding: 20px;
    border-radius: 15px;
    margin: 20px 0;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
}

button {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

.generate { background: #00c853; color: white; }
.complete { background: #2979ff; color: white; }

.badge {
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 8px;
    display: inline-block;
}

.common { background: #555; }
.rare { background: #1e88e5; }
.epic { background: #8e24aa; }
.legendary { background: #f9a825; color: black; }
</style>
</head>

<body>

<div class="container">
    <h1>Life RPG</h1>

    <div class="card">
        <div id="badge"></div>
        <div id="challenge">Press generate</div>
    </div>

    <button class="generate" onclick="generate()">Generate Quest</button>
    <button class="complete" onclick="complete()">Complete Quest</button>

    <p>Level: <span id="level">1</span></p>
    <p>XP: <span id="xp">0</span></p>
    <p>Streak: <span id="streak">0</span></p>
</div>

<script>

// ===================== RPG SYSTEM =====================

const missions = [
  { text: "Walk to a nearby place you’ve never explored", cat: "exploration", rarity: "common", xp: 10 },
  { text: "Do a 10 minute walk without checking your phone", cat: "fitness", rarity: "common", xp: 10 },
  { text: "Write 3 ideas to improve your life", cat: "creativity", rarity: "common", xp: 10 },

  { text: "Start a conversation with a stranger", cat: "social", rarity: "rare", xp: 30 },
  { text: "Find a café you’ve never been inside", cat: "exploration", rarity: "rare", xp: 30 },
  { text: "Take 5 photos of interesting things around you", cat: "creativity", rarity: "rare", xp: 30 },

  { text: "Talk to someone new and learn something about them", cat: "social", rarity: "epic", xp: 60 },
  { text: "Walk for 20 minutes noticing details you usually miss", cat: "exploration", rarity: "epic", xp: 60 },
  { text: "Do a creative challenge: design a new idea in your head", cat: "creativity", rarity: "epic", xp: 60 },

  { text: "Have a deep conversation with a stranger", cat: "social", rarity: "legendary", xp: 100 },
  { text: "Spend 30 minutes exploring somewhere completely new", cat: "exploration", rarity: "legendary", xp: 100 }
];

// ===================== STATE =====================

let current = null;

let xp = parseInt(localStorage.getItem("xp") || "0");
let level = parseInt(localStorage.getItem("level") || "1");
let streak = parseInt(localStorage.getItem("streak") || "0");

document.getElementById("xp").innerText = xp;
document.getElementById("level").innerText = level;
document.getElementById("streak").innerText = streak;

// ===================== HELPERS =====================

function getBadge(rarity){
    return `<span class="badge ${rarity}">${rarity.toUpperCase()}</span>`;
}

function checkLevelUp(){
    let newLevel = Math.floor(xp / 100) + 1;

    if(newLevel !== level){
        level = newLevel;
        localStorage.setItem("level", level);
    }

    document.getElementById("level").innerText = level;
}

// ===================== GENERATE =====================

let used = JSON.parse(localStorage.getItem("used")) || [];

function generate(){

    if(used.length >= missions.length){
        used = [];
    }

    let available = missions.filter(m => !used.includes(m.text));

    let mission = available[Math.floor(Math.random() * available.length)];

    used.push(mission.text);
    localStorage.setItem("used", JSON.stringify(used));

    current = mission;

    document.getElementById("challenge").innerText = mission.text;
    document.getElementById("badge").innerHTML = getBadge(mission.rarity);
}

// ===================== COMPLETE =====================

function complete(){

    if(!current) return;

    xp += current.xp;
    localStorage.setItem("xp", xp);

    let last = localStorage.getItem("last");
    let today = new Date().toDateString();

    if(last !== today){
        streak++;
        localStorage.setItem("streak", streak);
        localStorage.setItem("last", today);
    }

    checkLevelUp();

    document.getElementById("xp").innerText = xp;
    document.getElementById("streak").innerText = streak;

    current = null;
    document.getElementById("challenge").innerText = "Quest Completed!";
    document.getElementById("badge").innerHTML = "";
}

</script>

</body>
</html>
