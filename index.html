<script>

// ================= HELPERS =================

function pick(arr){
    return arr[Math.floor(Math.random() * arr.length)];
}

function shuffle(arr){
    return [...arr].sort(() => Math.random() - 0.5);
}

// ================= CORE BUILDING BLOCKS =================

// HARD-LOCKED OBJECT POOLS (no reuse fatigue loops)
const buildObjects = {
small: ["paper only", "10 sheets of paper", "cardboard pieces", "A4 paper", "newspaper"],
medium: ["cardboard boxes", "plastic bottles", "household junk", "tape + paper", "packaging materials"],
large: ["mixed household items", "furniture rearrangement", "multi-material build kit (everything you find in one room)"]
};

const buildGoals = [
"bridge between two chairs (minimum 25cm span)",
"freestanding tower that supports weight for 60 seconds",
"functional marble run with at least 3 directional changes",
"ball launcher that can consistently hit a target",
"mini chair or seat that can hold a small object",
"paper structure that resists a fan for 20 seconds"
];

const fitnessSkills = [
"wall handstand hold progression",
"10-minute mobility flow (hips + shoulders)",
"bodyweight strength circuit (push / pull / legs)",
"core stability challenge (plank variations)",
"balance control drill (single-leg stability)",
"explosive movement practice (jumps / plyometrics)"
];

const skillLearning = [
"learn basic juggling pattern (3 ball cascade theory)",
"learn a magic trick and perform it from memory",
"learn basic knot tying (5 essential knots)",
"learn a short memorisation system (chunking / loci)",
"learn a practical mental maths technique",
"learn basic coding logic (if/else thinking task)",
"learn speed reading technique and test improvement"
];

const creativeTasks = [
"design a fictional brand identity (logo + purpose + audience)",
"create a new sport with rules + scoring system",
"design a board game concept with win conditions",
"create a fictional world map with 5 locations",
"write a 1-page origin story for a character",
"invent a productivity system for daily life"
];

const cookingTasks = [
"cook a meal using only 5 ingredients max",
"recreate a fast food item from scratch",
"create a high-protein meal under £5",
"cook a dish you’ve never made before using one random ingredient",
"make a breakfast that combines sweet + savoury",
"create a ‘fridge clean-out’ meal with no recipe"
];

const weirdTasks = [
"spend 30 minutes living like a different decade (no tech rule)",
"rearrange your room for energy optimisation",
"invent a new rule that changes how you move for 1 hour",
"spend 1 hour only speaking in questions (no statements)",
"build a ‘daily ritual’ and perform it 3 times",
"create a fake emergency drill and execute it safely"
];

const businessTasks = [
"write a one-page idea for a digital product",
"identify 3 things you could sell online today",
"design a £10 micro-service you could offer",
"map out a simple content-to-income idea",
"find 1 problem you could solve for people online",
"create a 7-day plan to test a small money idea"
];

// ================= CATEGORY ENGINE =================

const categories = [
{
name: "BUILD",
weight: 30,
generator: () => ({
title: "STRUCTURAL BUILD MISSION",
category: "BUILD",
difficulty: "Medium",
duration: "60–120 mins",
mission: `Build a ${pick(buildGoals)} using ONLY ${pick(buildObjects.small.concat(buildObjects.medium))}.

Constraints:
- Must be freestanding or functional
- Must survive a stability test (30–60 seconds)
- Must serve a purpose (not just stacking objects)`,
requirements: ["Functional structure", "Stability test", "Defined purpose"]
})
},

{
name: "FITNESS",
weight: 20,
generator: () => ({
title: "PHYSICAL PERFORMANCE MISSION",
category: "FITNESS",
difficulty: "Medium",
duration: "30–60 mins",
mission: `Complete a focused physical development session:

Task:
- ${pick(fitnessSkills)}

Rules:
- Minimum 30 minutes
- Must track progress (time, reps, or attempts)`,
requirements: ["30 min training", "tracked progress", "skill focus"]
})
},

{
name: "SKILL",
weight: 20,
generator: () => ({
title: "SKILL ACQUISITION MISSION",
category: "SKILL",
difficulty: "Medium",
duration: "45–90 mins",
mission: `Learn and demonstrate a new skill:

Task:
- ${pick(skillLearning)}

Outcome:
- You must be able to demonstrate or explain it after the session`,
requirements: ["Learning session", "demonstration ability"]
})
},

{
name: "CREATIVE",
weight: 15,
generator: () => ({
title: "CREATIVE DESIGN MISSION",
category: "CREATIVE",
difficulty: "Easy–Medium",
duration: "45–90 mins",
mission: `Create a complete original concept:

Task:
- ${pick(creativeTasks)}

Output must include:
- Name
- Structure or system
- Purpose`,
requirements: ["Original concept", "Defined structure", "Named creation"]
})
},

{
name: "COOKING",
weight: 10,
generator: () => ({
title: "COOKING CREATION MISSION",
category: "COOK",
difficulty: "Easy–Medium",
duration: "45–90 mins",
mission: `Create a full meal:

Task:
- ${pick(cookingTasks)}

Rule:
- Must be something you would NOT normally make`,
requirements: ["Cooked meal", "New recipe", "Evaluation"]
})
},

{
name: "WEIRD",
weight: 5,
generator: () => ({
title: "CONSTRAINT EXPERIMENT",
category: "WEIRD",
difficulty: "Easy",
duration: "30–60 mins",
mission: `Run a controlled real-world experiment:

Task:
- ${pick(weirdTasks)}

Must include:
- Start and end time
- Reflection on effect`,
requirements: ["Time-bound experiment", "Reflection"]
})
},

{
name: "BUSINESS",
weight: 5,
generator: () => ({
title: "IDEA GENERATION MISSION",
category: "BUSINESS",
difficulty: "Easy",
duration: "20–40 mins",
mission: `Generate a practical money-related idea:

Task:
- ${pick(businessTasks)}

Must include:
- Monetisation method
- First action step`,
requirements: ["Idea created", "Monetisation path", "Action step"]
})
}
];

// ================= WEIGHTED PICK =================

function weightedPick(){
    let pool = [];

    categories.forEach(cat => {
        for(let i = 0; i < cat.weight; i++){
            pool.push(cat.generator);
        }
    });

    return pick(pool);
}

// ================= STATE =================

let history = JSON.parse(localStorage.getItem("history") || "[]");
let currentMission = null;

// ================= GENERATE =================

function generate(){

    let mission;

    for(let i = 0; i < 30; i++){
        const gen = weightedPick();
        mission = gen();

        if(!history.includes(mission.title + mission.mission)) break;
    }

    history.push(mission.title + mission.mission);
    if(history.length > 300) history.shift();

    localStorage.setItem("history", JSON.stringify(history));
    currentMission = mission;

    document.getElementById("challenge").innerText =
`${mission.title}

Category: ${mission.category}
Difficulty: ${mission.difficulty}
Duration: ${mission.duration}

Mission:
${mission.mission}

Requirements:
- ${mission.requirements.join("\n- ")}`;
}

</script>
