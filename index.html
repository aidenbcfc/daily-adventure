<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Life RPG</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 90%;
    max-width: 500px;
    text-align: center;
}

.card {
    background: #1c1c1c;
    padding: 20px;
    border-radius: 15px;
    margin: 20px 0;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
}

button {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

.generate { background: #00c853; color: white; }
.complete { background: #2979ff; color: white; }

/* RARITY */
.badge {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 8px;
    display: inline-block;
    margin: auto;
}

.common { background: #555; }
.rare { background: #1e88e5; }
.epic { background: #8e24aa; }
.legendary { background: #f9a825; color: black; }

/* XP BAR */
.xp-bar {
    width: 100%;
    height: 12px;
    background: #333;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 10px;
}

.xp-fill {
    height: 100%;
    background: #00c853;
    width: 0%;
}

/* USER SCREEN */
#setup {
    position: fixed;
    inset: 0;
    background: #0f0f0f;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

#setup input {
    padding: 12px;
    width: 80%;
    border-radius: 10px;
    border: none;
    margin-top: 10px;
}

#setup button {
    width: 80%;
    margin-top: 10px;
}
</style>
</head>

<body>

<!-- ================= USER SETUP ================= -->
<div id="setup">
    <h2>Enter Your Name</h2>
    <input id="usernameInput" placeholder="Your name..." />
    <button onclick="startGame()">Start Adventure</button>
</div>

<!-- ================= MAIN APP ================= -->
<div class="container" id="app" style="display:none;">

    <h1 id="greeting">Life RPG</h1>

    <div class="card">
        <div id="badge"></div>
        <div id="challenge">Press generate</div>
    </div>

    <button class="generate" onclick="generate()">Generate Quest</button>
    <button class="complete" onclick="complete()">Complete Quest</button>

    <div class="xp-bar">
        <div class="xp-fill" id="xpFill"></div>
    </div>

    <p>Level: <span id="level">1</span></p>
    <p>XP: <span id="xp">0</span> / 100</p>
    <p>Streak: <span id="streak">0</span></p>
</div>

<script>

// ================= DATA =================

const missions = [
  { text: "Walk to a nearby place you’ve never explored", cat: "exploration", rarity: "common", xp: 10 },
  { text: "Take a 10 minute walk without checking your phone", cat: "fitness", rarity: "common", xp: 10 },
  { text: "Write 3 ideas to improve your life", cat: "creativity", rarity: "common", xp: 10 },

  { text: "Start a conversation with a stranger", cat: "social", rarity: "rare", xp: 30 },
  { text: "Find a café you’ve never been inside", cat: "exploration", rarity: "rare", xp: 30 },

  { text: "Talk to someone new and learn something about them", cat: "social", rarity: "epic", xp: 60 },
  { text: "Explore somewhere completely new for 20 minutes", cat: "exploration", rarity: "epic", xp: 60 },

  { text: "Have a deep conversation with a stranger", cat: "social", rarity: "legendary", xp: 100 },
  { text: "Spend 30 minutes exploring a completely unknown area", cat: "exploration", rarity: "legendary", xp: 100 }
];

// ================= STATE =================

let current = null;

let username = localStorage.getItem("username");
let xp = parseInt(localStorage.getItem("xp") || "0");
let level = parseInt(localStorage.getItem("level") || "1");
let streak = parseInt(localStorage.getItem("streak") || "0");

let used = JSON.parse(localStorage.getItem("used")) || [];

// ================= INIT =================

if (username) {
    document.getElementById("setup").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("greeting").innerText = `Welcome, ${username}`;
}

// ================= USER START =================

function startGame(){
    const input = document.getElementById("usernameInput").value;

    if(!input) return;

    username = input;
    localStorage.setItem("username", username);

    document.getElementById("setup").style.display = "none";
    document.getElementById("app").style.display = "block";

    document.getElementById("greeting").innerText = `Welcome, ${username}`;
}

// ================= UI UPDATE =================

function updateUI(){

    document.getElementById("xp").innerText = xp;
    document.getElementById("level").innerText = level;
    document.getElementById("streak").innerText = streak;

    let percent = (xp % 100);
    document.getElementById("xpFill").style.width = percent + "%";
}

// ================= BADGE =================

function getBadge(rarity){
    return `<span class="badge ${rarity}">${rarity.toUpperCase()}</span>`;
}

// ================= LEVEL SYSTEM =================

function checkLevel(){
    let newLevel = Math.floor(xp / 100) + 1;

    if(newLevel !== level){
        level = newLevel;
        localStorage.setItem("level", level);
    }
}

// ================= GENERATE =================

function generate(){

    if(used.length >= missions.length){
        used = [];
    }

    let available = missions.filter(m => !used.includes(m.text));

    let mission = available[Math.floor(Math.random() * available.length)];

    used.push(mission.text);
    localStorage.setItem("used", JSON.stringify(used));

    current = mission;

    document.getElementById("challenge").innerText = mission.text;
    document.getElementById("badge").innerHTML = getBadge(mission.rarity);
}

// ================= COMPLETE =================

function complete(){

    if(!current) return;

    xp += current.xp;
    localStorage.setItem("xp", xp);

    let last = localStorage.getItem("last");
    let today = new Date().toDateString();

    if(last !== today){
        streak++;
        localStorage.setItem("streak", streak);
        localStorage.setItem("last", today);
    }

    checkLevel();
    updateUI();

    current = null;
    document.getElementById("challenge").innerText = "Quest Completed!";
    document.getElementById("badge").innerHTML = "";
}

// initial render
updateUI();

</script>

</body>
</html>
