<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Infinite Life RPG</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 90%;
    max-width: 500px;
    text-align: center;
}

.card {
    background: #1c1c1c;
    padding: 20px;
    border-radius: 15px;
    margin: 20px 0;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
    font-size: 16px;
    line-height: 1.4;
}

button {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

.generate { background: #00c853; color: white; }
.complete { background: #2979ff; color: white; }

.badge {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 8px;
    display: inline-block;
    margin: auto;
}

.common { background: #555; }
.rare { background: #1e88e5; }
.epic { background: #8e24aa; }
.legendary { background: #f9a825; color: black; }
</style>
</head>

<body>

<div class="container">
    <h1>Infinite Life RPG</h1>

    <div class="card">
        <div id="badge"></div>
        <div id="challenge">Press generate</div>
    </div>

    <button class="generate" onclick="generate()">Generate Quest</button>
    <button class="complete" onclick="complete()">Complete Quest</button>

    <p>Level: <span id="level">1</span></p>
    <p>XP: <span id="xp">0</span></p>
    <p>Streak: <span id="streak">0</span></p>
</div>

<script>

// ===================== CORE BUILDING BLOCKS =====================

const actions = {
  exploration: ["Go to", "Walk to", "Find", "Explore", "Visit"],
  social: ["Talk to", "Ask", "Approach", "Start a conversation with"],
  creativity: ["Think about", "Write down", "Create", "Design"],
  fitness: ["Walk for", "Move towards", "Explore on foot", "Go to"]
};

const targets = {
  exploration: [
    "a place nearby you’ve never properly explored",
    "a café you’ve never been inside",
    "a quiet street you usually ignore",
    "a local park",
    "a landmark you pass but never stop at"
  ],

  social: [
    "a stranger and ask a simple question about their day",
    "a shop worker and ask for a recommendation",
    "someone new and learn something interesting about them",
    "a person you’ve never spoken to before"
  ],

  creativity: [
    "a problem in your life and list 3 solutions",
    "a simple idea that could improve your routine",
    "a small project you could start this week",
    "a habit that would improve your life"
  ],

  fitness: [
    "for 10–20 minutes without distractions",
    "to a place you normally wouldn’t walk to",
    "and notice 5 things you usually miss",
    "at a steady pace while observing your surroundings"
  ]
};

// ===================== RARITY SYSTEM =====================

function getRarity(){
    const roll = Math.random();

    if(roll < 0.60) return {name:"common", xp:10};
    if(roll < 0.85) return {name:"rare", xp:25};
    if(roll < 0.97) return {name:"epic", xp:60};
    return {name:"legendary", xp:120};
}

// ===================== STATE =====================

let current = null;

let xp = parseInt(localStorage.getItem("xp") || "0");
let level = parseInt(localStorage.getItem("level") || "1");
let streak = parseInt(localStorage.getItem("streak") || "0");

document.getElementById("xp").innerText = xp;
document.getElementById("level").innerText = level;
document.getElementById("streak").innerText = streak;

// ===================== HELPERS =====================

function pick(arr){
    return arr[Math.floor(Math.random() * arr.length)];
}

function getCategory(){
    return pick(Object.keys(actions));
}

// ===================== GENERATE (INFINITE SYSTEM) =====================

function generate(){

    const category = getCategory();

    const action = pick(actions[category]);
    const target = pick(targets[category]);
    const rarity = getRarity();

    current = {
        text: `${action} ${target}`,
        rarity: rarity.name,
        xp: rarity.xp
    };

    document.getElementById("challenge").innerText = current.text;
    document.getElementById("badge").innerHTML =
        `<span class="badge ${rarity.name}">${rarity.name.toUpperCase()} +${rarity.xp} XP</span>`;
}

// ===================== LEVEL SYSTEM =====================

function updateLevel(){
    let newLevel = Math.floor(xp / 100) + 1;
    level = newLevel;

    document.getElementById("level").innerText = level;
}

// ===================== COMPLETE =====================

function complete(){

    if(!current) return;

    xp += current.xp;
    localStorage.setItem("xp", xp);

    let last = localStorage.getItem("last");
    let today = new Date().toDateString();

    if(last !== today){
        streak++;
        localStorage.setItem("streak", streak);
        localStorage.setItem("last", today);
    }

    updateLevel();

    document.getElementById("xp").innerText = xp;
    document.getElementById("streak").innerText = streak;

    current = null;
    document.getElementById("challenge").innerText = "Quest Completed!";
    document.getElementById("badge").innerHTML = "";
}

</script>

</body>
</html>
