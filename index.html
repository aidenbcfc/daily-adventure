<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Life Quest System</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0f0f0f;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container {
    width:90%;
    max-width:520px;
    text-align:center;
}

.card {
    background:#1c1c1c;
    padding:20px;
    border-radius:15px;
    margin:20px 0;
    min-height:130px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    line-height:1.4;
}

button {
    width:100%;
    padding:15px;
    margin:8px 0;
    border:none;
    border-radius:10px;
    font-size:16px;
}

.generate { background:#00c853; color:white; }
.complete { background:#2979ff; color:white; }
</style>
</head>

<body>

<div class="container">
    <h1>Real Life Quests</h1>

    <div class="card" id="challenge">Press generate</div>

    <button class="generate" onclick="generate()">Generate Quest</button>
    <button class="complete" onclick="complete()">Complete Quest</button>

    <p>Streak: <span id="streak">0</span></p>
    <p>Total: <span id="total">0</span></p>
</div>

<script>

// ================= STATE =================

let streak = parseInt(localStorage.getItem("streak") || "0");
let total = parseInt(localStorage.getItem("total") || "0");

document.getElementById("streak").innerText = streak;
document.getElementById("total").innerText = total;

// ================= SOCIAL (REJECTION / INTERACTION) =================

const social = [
"ask a stranger for directions to somewhere nearby",
"ask a shop worker what the most popular item is",
"ask a café worker what they recommend",
"ask someone for a random recommendation nearby",
"start a short conversation with a stranger",
"ask a stranger what time it is (even if you know it)",
"ask a worker how their day is going",
"ask someone where they would eat nearby",
"ask a stranger for a simple opinion on something",
"ask a shop worker what they would choose from the menu",
"compliment a stranger politely",
"ask someone for a local hidden gem",
"ask a worker what people usually buy here",
"ask someone for directions even if you know them",
"ask a stranger for their favourite place nearby",
"ask a café worker what drink they recommend",
"ask someone what they are doing today",
"ask a stranger what they think of the area",
"ask a worker what’s busy today",
"ask someone to recommend one thing nearby",
"ask a stranger for a simple food suggestion",
"ask a worker what they like about their job",
"ask someone for a random local tip",
"ask a stranger for a quick suggestion",
"ask someone what they’d do nearby",
"ask a worker what they’d choose",
"ask someone what’s worth seeing here",
"ask a stranger a simple yes/no question",
"ask someone what they recommend eating",
"ask a worker what’s underrated here",
"ask someone for a place to visit",
"ask a stranger what they think is good here",
"ask someone for a simple opinion",
"ask a worker what’s popular today",
"ask someone what they like around here"
];

// ================= WORLD ACTIONS =================

const world = [
"walk into a shop you’ve never entered before",
"take a different route home than usual",
"walk down a street you normally ignore",
"go somewhere within 10 minutes you’ve never been",
"enter the nearest unfamiliar building",
"walk for 10 minutes without a planned direction",
"go to a place you pass but never enter",
"turn down a random street and keep walking",
"walk to the next street over from usual",
"go somewhere slightly outside your comfort route",
"walk until you find something interesting",
"go explore one block further than normal",
"visit a nearby area you never stop in",
"walk without using your usual route",
"go somewhere you normally avoid",
"walk in the opposite direction of usual",
"visit a random nearby street",
"go somewhere you’ve seen but never entered",
"walk to the edge of your normal area",
"go to a nearby place you’ve never properly explored",
"walk and choose random turns",
"go somewhere visually unfamiliar nearby",
"walk to the closest unknown spot",
"go somewhere slightly uncomfortable but safe",
"walk until something new appears"
];

// ================= CHALLENGE ACTIONS =================

const challenge = [
"stand somewhere slightly busy for 2 minutes",
"walk into a shop and leave without buying anything",
"ask a question you normally wouldn’t ask",
"start a conversation with someone new",
"walk into a place you feel slightly unsure about",
"do something you normally avoid in public",
"ask a stranger something simple even if awkward",
"walk somewhere unfamiliar without checking your phone",
"spend 5 minutes in a new environment without leaving",
"approach a counter and ask for a recommendation",
"sit somewhere new for 5 minutes",
"walk into a café and just look around for 2 minutes",
"ask a worker a question you don’t need to ask",
"stand in a different area than usual",
"walk somewhere and stop somewhere random"
];

// ================= GENERATOR =================

function pick(arr){
    return arr[Math.floor(Math.random()*arr.length)];
}

function generate(){

    const pools = [social, world, challenge];
    const task = pick(pick(pools));

    document.getElementById("challenge").innerText = task;
}

// ================= COMPLETE =================

function complete(){
    total++;
    localStorage.setItem("total", total);

    let last = localStorage.getItem("last");
    let today = new Date().toDateString();

    if(last !== today){
        streak++;
        localStorage.setItem("streak", streak);
        localStorage.setItem("last", today);
    }

    document.getElementById("streak").innerText = streak;
    document.getElementById("total").innerText = total;
}

</script>

</body>
</html>
