<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Daily Adventure</title>

<link rel="manifest" href="manifest.json">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 90%;
    max-width: 500px;
    text-align: center;
}

.card {
    background: #1c1c1c;
    padding: 20px;
    border-radius: 15px;
    margin: 20px 0;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    line-height: 1.4;
}

button {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

.generate { background: #00c853; color: white; }
.complete { background: #2979ff; color: white; }
</style>
</head>

<body>

<div class="container">
    <h1>Daily Adventure</h1>

    <div class="card" id="challenge">Press generate</div>

    <button class="generate" onclick="generate()">Generate</button>
    <button class="complete" onclick="complete()">Complete</button>

    <p>Streak: <span id="streak">0</span></p>
    <p>Total: <span id="total">0</span></p>
</div>

<script>

// ===================== DATA =====================

const actions = {
  exploration: [
    "Go to", "Walk to", "Find", "Explore", "Head towards", "Visit"
  ],
  social: [
    "Talk to", "Approach", "Ask", "Start a conversation with", "Compliment"
  ],
  creation: [
    "Think about", "Write down", "Create", "Design", "Come up with"
  ]
};

const subjects = {
  exploration: [
    "a street you have never walked down",
    "a place nearby you usually ignore",
    "a café you have never been inside",
    "a random direction from where you are now",
    "a local park you rarely visit",
    "a landmark you pass but never stop at"
  ],

  social: [
    "a stranger and ask them a simple question about their day",
    "a shop worker and ask for their recommendation",
    "someone nearby and give them a genuine compliment",
    "a person you’ve never spoken to before",
    "someone working in a café or shop"
  ],

  creation: [
    "a problem in your daily life and 3 ways to fix it",
    "a simple idea that could improve your routine",
    "a small project you could start this week",
    "a habit that would improve your life",
    "a way to make your day easier or more interesting"
  ]
};

// ===================== CORE ENGINE =====================

function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function getCategory() {
    return pick(Object.keys(actions));
}

function generate() {

    const category = getCategory();

    const action = pick(actions[category]);
    const subject = pick(subjects[category]);

    current = `${action} ${subject}`;

    document.getElementById("challenge").innerText = current;
}

// ===================== STATE =====================

let current = null;

let streak = localStorage.getItem("streak") || 0;
let total = localStorage.getItem("total") || 0;

document.getElementById("streak").innerText = streak;
document.getElementById("total").innerText = total;

// ===================== COMPLETE =====================

function complete(){
    if(!current) return;

    total++;
    localStorage.setItem("total", total);

    let last = localStorage.getItem("last");
    let today = new Date().toDateString();

    if(last !== today){
        streak++;
        localStorage.setItem("streak", streak);
        localStorage.setItem("last", today);
    }

    document.getElementById("total").innerText = total;
    document.getElementById("streak").innerText = streak;

    current = null;
    document.getElementById("challenge").innerText = "Completed!";
}

// ===================== SERVICE WORKER =====================

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}

</script>

</body>
</html>
