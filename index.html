// ================= CATEGORY SYSTEM =================

const library = {
    physicalMastery,
    creativeOutput,
    buildMissions,
    skillAcquisition,
    lifeUpgrade,
};

const categoryNames = Object.keys(library);

function getCategory(){

    let options = categoryNames.filter(c => !recentCategories.includes(c));

    if(options.length === 0){
        recentCategories = [];
        options = categoryNames;
    }

    const chosen = pick(options);

    recentCategories.push(chosen);

    if(recentCategories.length > 3){
        recentCategories.shift();
    }

    localStorage.setItem("recentCategories", JSON.stringify(recentCategories));

    return chosen;
}

// ================= XP SYSTEM =================

function addXP(amount) {
    xp += amount;

    let xpNeeded = level * 100;

    if (xp >= xpNeeded) {
        xp -= xpNeeded;
        level++;

        alert("LEVEL UP! You are now level " + level);
    }

    localStorage.setItem("xp", xp);
    localStorage.setItem("level", level);

    updateXPUI();
}

function updateXPUI() {
    document.getElementById("xp").innerText = xp;
    document.getElementById("level").innerText = level;
    document.getElementById("xpNeeded").innerText = level * 100;
}

// ================= GENERATE =================

function generate(){

    const category = getCategory();
    const mission = pick(library[category]);

    const key = category + mission;

    if(history.includes(key)){
        return generate();
    }

    history.push(key);

    if(history.length > 300){
        history.shift();
    }

    localStorage.setItem("history", JSON.stringify(history));

    document.getElementById("challenge").innerText = mission;
}

// ================= COMPLETE =================

function complete(){

    total++;
    addXP(25);
    localStorage.setItem("total", total);

    let last = localStorage.getItem("last");
    let today = new Date().toDateString();

    if(last !== today){
        streak++;
        localStorage.setItem("streak", streak);
        localStorage.setItem("last", today);
    }

    document.getElementById("streak").innerText = streak;
    document.getElementById("total").innerText = total;

    updateXPUI();
}
