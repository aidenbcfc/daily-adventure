<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Quest Generator</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0f0f0f;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container {
    width:90%;
    max-width:600px;
    text-align:center;
}

.card {
    background:#1c1c1c;
    padding:22px;
    border-radius:15px;
    margin:20px 0;
    min-height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
    line-height:1.5;
    white-space:pre-wrap;
}

button {
    width:100%;
    padding:15px;
    margin:8px 0;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

.generate { background:#00c853; color:white; }
.complete { background:#2979ff; color:white; }

p { margin:6px 0; }
</style>
</head>

<body>

<div class="container">
    <h1>Life Quest Generator</h1>

    <div class="card" id="challenge">Press generate</div>

    <button class="generate" onclick="generate()">Generate Quest</button>
    <button class="complete" onclick="complete()">Complete Quest</button>

    <p>Streak: <span id="streak">0</span></p>
    <p>Total: <span id="total">0</span></p>
</div>

<script>

// ================= STATE =================

let streak = parseInt(localStorage.getItem("streak") || "0");
let total = parseInt(localStorage.getItem("total") || "0");
let history = JSON.parse(localStorage.getItem("history") || "[]");

document.getElementById("streak").innerText = streak;
document.getElementById("total").innerText = total;

// ================= HELPERS =================

function pick(arr){
    return arr[Math.floor(Math.random() * arr.length)];
}

// ================= CONTENT POOLS =================

const buildGoals = [
"bridge between two chairs (25cm+ span)",
"freestanding tower that supports weight for 60 seconds",
"functional marble run with 3 direction changes",
"ball launcher that hits a target",
"self-standing structure that holds a phone",
"paper structure resisting airflow for 20 seconds"
];

const buildMaterials = [
"paper only",
"cardboard only",
"household junk only",
"tape + paper only",
"items from one room only"
];

const fitnessSkills = [
"wall handstand progression",
"10-min mobility flow",
"bodyweight strength circuit",
"core stability training",
"balance control drill",
"jump / plyometric session"
];

const skillTasks = [
"learn 3-ball juggling basics",
"learn a simple magic trick",
"learn 5 basic knots",
"memorisation technique (loci method)",
"mental maths shortcut",
"basic coding logic thinking exercise"
];

const creativeTasks = [
"design a board game",
"invent a new sport",
"create a fictional world",
"design a brand identity",
"write a character origin story",
"invent a life system or rule set"
];

const cookingTasks = [
"cook a meal from scratch using 5 ingredients max",
"recreate a fast food item",
"create a high-protein meal under £5",
"make something using 1 random ingredient",
"breakfast combining sweet + savoury",
"fridge clean-out meal"
];

const weirdTasks = [
"live 30 mins without technology",
"rearrange your room for optimisation",
"1 hour only asking questions (no statements)",
"invent a daily ritual and repeat it 3 times",
"design a fake emergency drill",
"change how you walk for 1 hour (rule system)"
];

const businessTasks = [
"write a simple digital product idea",
"list 3 things you could sell online",
"design a £10 micro service",
"map a side hustle idea",
"find a problem you could solve",
"plan a 7-day test idea"
];

// ================= CATEGORY SYSTEM =================

const categories = [
{
weight: 30,
generator: () => ({
title: "BUILD MISSION",
category: "BUILD",
difficulty: "Medium",
duration: "60–120 mins",
mission:
`Build a ${pick(buildGoals)}.

Constraints:
- Must use only ${pick(buildMaterials)}
- Must be freestanding or functional
- Must pass a 30-second stability test`,
requirements: ["Functional build", "Stability test", "Defined purpose"]
})
},

{
weight: 20,
generator: () => ({
title: "FITNESS MISSION",
category: "FITNESS",
difficulty: "Medium",
duration: "30–60 mins",
mission:
`Complete a physical training session:

Focus: ${pick(fitnessSkills)}

Rules:
- Minimum 30 minutes
- Track reps, time or attempts`,
requirements: ["30 min training", "tracked progress"]
})
},

{
weight: 20,
generator: () => ({
title: "SKILL MISSION",
category: "SKILL",
difficulty: "Medium",
duration: "45–90 mins",
mission:
`Learn and demonstrate:

Task: ${pick(skillTasks)}

You must be able to demonstrate or explain it afterwards.`,
requirements: ["Learning session", "Demonstration ability"]
})
},

{
weight: 15,
generator: () => ({
title: "CREATIVE MISSION",
category: "CREATIVE",
difficulty: "Easy–Medium",
duration: "45–90 mins",
mission:
`Create something original:

Task: ${pick(creativeTasks)}

Include:
- Name
- Structure
- Purpose`,
requirements: ["Original creation", "Named concept"]
})
},

{
weight: 10,
generator: () => ({
title: "COOKING MISSION",
category: "COOK",
difficulty: "Easy–Medium",
duration: "45–90 mins",
mission:
`Cook a meal:

Task: ${pick(cookingTasks)}

Must be something new to you.`,
requirements: ["Cooked meal", "New recipe"]
})
},

{
weight: 5,
generator: () => ({
title: "WEIRD MISSION",
category: "WEIRD",
difficulty: "Easy",
duration: "30–60 mins",
mission:
`Run a behavioural experiment:

Task: ${pick(weirdTasks)}

Reflect afterwards on the experience.`,
requirements: ["Experiment", "Reflection"]
})
},

{
weight: 5,
generator: () => ({
title: "BUSINESS MISSION",
category: "BUSINESS",
difficulty: "Easy",
duration: "20–40 mins",
mission:
`Create a money idea:

Task: ${pick(businessTasks)}

Include:
- Monetisation method
- First step`,
requirements: ["Idea", "Monetisation plan"]
})
}
];

// ================= GENERATION =================

function weightedPick(){
    let pool = [];

    categories.forEach(cat => {
        for(let i = 0; i < cat.weight; i++){
            pool.push(cat.generator);
        }
    });

    return pick(pool);
}

function generate(){

    let mission;

    for(let i = 0; i < 30; i++){
        const gen = weightedPick();
        mission = gen();

        if(!history.includes(mission.title + mission.mission)) break;
    }

    history.push(mission.title + mission.mission);

    if(history.length > 300) history.shift();

    localStorage.setItem("history", JSON.stringify(history));

    document.getElementById("challenge").innerText =
`${mission.title}

Category: ${mission.category}
Difficulty: ${mission.difficulty}
Duration: ${mission.duration}

MISSION:
${mission.mission}

REQUIREMENTS:
- ${mission.requirements.join("\n- ")}`;
}

// ================= COMPLETE =================

function complete(){

    total++;
    localStorage.setItem("total", total);

    let last = localStorage.getItem("last");
    let today = new Date().toDateString();

    if(last !== today){
        streak++;
        localStorage.setItem("streak", streak);
        localStorage.setItem("last", today);
    }

    document.getElementById("streak").innerText = streak;
    document.getElementById("total").innerText = total;
}

</script>

</body>
</html>
