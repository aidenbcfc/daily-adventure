<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Infinite Life RPG</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f0f0f;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 90%;
    max-width: 500px;
    text-align: center;
}

.card {
    background: #1c1c1c;
    padding: 20px;
    border-radius: 15px;
    margin: 20px 0;
    min-height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    line-height: 1.4;
}

button {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

.generate { background: #00c853; color: white; }
.complete { background: #2979ff; color: white; }
</style>
</head>

<body>

<div class="container">
    <h1>Infinite Life RPG</h1>

    <div class="card" id="challenge">Press generate</div>

    <button class="generate" onclick="generate()">Generate</button>
    <button class="complete" onclick="complete()">Complete</button>

    <p>Streak: <span id="streak">0</span></p>
    <p>Total: <span id="total">0</span></p>
</div>

<script>

// ================= STATE =================

let streak = parseInt(localStorage.getItem("streak") || "0");
let total = parseInt(localStorage.getItem("total") || "0");

document.getElementById("streak").innerText = streak;
document.getElementById("total").innerText = total;

// ================= CORE INTENT =================

const intents = [
    "explore something nearby",
    "observe your surroundings closely",
    "notice something you normally ignore",
    "interact briefly with your environment",
    "improve a small part of your surroundings",
    "learn something from a real-world moment",
    "move with awareness for a short time"
];

// ================= CONTEXT ENGINE =================

const contexts = [
    "in a place you pass every day",
    "within a 5–10 minute walk",
    "in your immediate surroundings",
    "in a direction you wouldn’t normally go",
    "in the most boring area near you (find interest in it)",
    "somewhere completely ordinary",
    "wherever you currently are"
];

// ================= ANGLE SHIFT =================

const angles = [
    "as if you're seeing it for the first time",
    "as if you're documenting it for a future version of yourself",
    "with full attention for 2 minutes",
    "as a small real-life experiment",
    "as if it contains something meaningful",
    "as if it were part of a game world"
];

// ================= ACTION RULES =================

const actions = [
    "take mental notes",
    "find 3 details you’ve never noticed",
    "change one small thing about your route or behaviour",
    "observe without judgement",
    "compare two small things nearby",
    "focus on one object and analyse it closely",
    "notice patterns in your surroundings"
];

// ================= GENERATOR =================

function pick(arr){
    return arr[Math.floor(Math.random() * arr.length)];
}

function generate(){

    const intent = pick(intentssafe());
    const context = pick(contexts);
    const angle = pick(angles);
    const action = pick(actions);

    const sentence =
        `Your mission is to ${intent} ${context}, ${action}, ${angle}.`;

    document.getElementById("challenge").innerText = sentence;
}

// small safety wrapper (prevents repetition bias)
function intentssafe(){
    let shuffled = [...intents].sort(() => Math.random() - 0.5);
    return shuffled;
}

// ================= COMPLETE =================

function complete(){

    total++;
    localStorage.setItem("total", total);

    let last = localStorage.getItem("last");
    let today = new Date().toDateString();

    if(last !== today){
        streak++;
        localStorage.setItem("streak", streak);
        localStorage.setItem("last", today);
    }

    document.getElementById("streak").innerText = streak;
    document.getElementById("total").innerText = total;
}

</script>

</body>
</html>
