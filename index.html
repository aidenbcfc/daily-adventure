<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Daily Adventure</title>

<link rel="manifest" href="manifest.json">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 90%;
    max-width: 500px;
    text-align: center;
}

.card {
    background: #1c1c1c;
    padding: 20px;
    border-radius: 15px;
    margin: 20px 0;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
}

button {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: none;
    border-radius: 10px;
}

.generate { background: #00c853; color: white; }
.complete { background: #2979ff; color: white; }
</style>
</head>

<body>

<div class="container">
    <h1>Daily Adventure</h1>

    <div class="card" id="challenge">Press generate</div>

    <button class="generate" onclick="generate()">Generate</button>
    <button class="complete" onclick="complete()">Complete</button>

    <p>Streak: <span id="streak">0</span></p>
    <p>Total: <span id="total">0</span></p>
</div>

<script>
// ---------------- DATA ----------------
const actions = [
  { text: "Explore", type: "exploration" },
  { text: "Discover", type: "exploration" },
  { text: "Visit", type: "exploration" },

  { text: "Film", type: "content" },
  { text: "Document", type: "content" },
  { text: "Review", type: "content" },

  { text: "Interview", type: "social" },
  { text: "Talk to", type: "social" },

  { text: "Create", type: "creation" },
  { text: "Design", type: "creation" }
];

const subjects = [
  { text: "a hidden street", type: "exploration" },
  { text: "a local park", type: "exploration" },
  { text: "a café", type: "exploration" },
  { text: "a landmark", type: "exploration" },

  { text: "a stranger", type: "social" },
  { text: "a shop worker", type: "social" },
  { text: "a café worker", type: "social" },

  { text: "a street scene", type: "content" },
  { text: "a weird object", type: "content" },

  { text: "a business idea", type: "creation" },
  { text: "a product concept", type: "creation" }
];

const constraints = [
  "within 30 mins",
  "walking only",
  "under £5",
  "no transport",
  "use only phone",
  "must film it"
];

const outputs = [
  "TikTok",
  "YouTube Short",
  "photo story",
  "mini documentary",
  "journal entry"
];

// ---------------- RULE ENGINE ----------------
function getMatchingSubject(actionType) {
    const filtered = subjects.filter(s => s.type === actionType);
    return filtered[Math.floor(Math.random() * filtered.length)];
}

// ---------------- STATE ----------------
let current = null;

let streak = localStorage.getItem("streak") || 0;
let total = localStorage.getItem("total") || 0;

document.getElementById("streak").innerText = streak;
document.getElementById("total").innerText = total;

// ---------------- FUNCTIONS ----------------
function generate() {

    const action = actions[Math.floor(Math.random() * actions.length)];
    const subject = getMatchingSubject(action.type);
    const constraint = constraints[Math.floor(Math.random() * constraints.length)];
    const output = outputs[Math.floor(Math.random() * outputs.length)];

    current = `${action.text} ${subject.text} ${constraint} → create ${output}`;

    document.getElementById("challenge").innerText = current;
}

function complete(){
    if(!current) return;

    total++;
    localStorage.setItem("total", total);

    let last = localStorage.getItem("last");
    let today = new Date().toDateString();

    if(last !== today){
        streak++;
        localStorage.setItem("streak", streak);
        localStorage.setItem("last", today);
    }

    document.getElementById("total").innerText = total;
    document.getElementById("streak").innerText = streak;

    current = null;
    document.getElementById("challenge").innerText = "Completed!";
}

// ---------------- SERVICE WORKER ----------------
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
