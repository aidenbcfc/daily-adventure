<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Infinite Life RPG</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 90%;
    max-width: 500px;
    text-align: center;
}

.card {
    background: #1c1c1c;
    padding: 20px;
    border-radius: 15px;
    margin: 20px 0;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
}

button {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

.generate { background: #00c853; color: white; }
.complete { background: #2979ff; color: white; }

.badge {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 8px;
}

.common { background: #555; }
.rare { background: #1e88e5; }
.epic { background: #8e24aa; }
.legendary { background: #f9a825; color: black; }
</style>
</head>

<body>

<div class="container">
    <h1>Infinite Life RPG</h1>

    <div class="card">
        <div id="badge"></div>
        <div id="challenge">Press generate</div>
    </div>

    <button class="generate" onclick="generate()">Generate Quest</button>
    <button class="complete" onclick="complete()">Complete Quest</button>

    <p>Level: <span id="level">1</span></p>
    <p>XP: <span id="xp">0</span></p>
    <p>Streak: <span id="streak">0</span></p>
</div>

<script>

// ===================== STATE =====================

let current = null;

let xp = parseInt(localStorage.getItem("xp") || "0");
let level = parseInt(localStorage.getItem("level") || "1");
let streak = parseInt(localStorage.getItem("streak") || "0");

// anti-repeat memory (last 50 missions)
let history = JSON.parse(localStorage.getItem("history") || "[]");

document.getElementById("xp").innerText = xp;
document.getElementById("level").innerText = level;
document.getElementById("streak").innerText = streak;

// ===================== RANDOM HELPERS =====================

function pick(arr){
    return arr[Math.floor(Math.random() * arr.length)];
}

// ===================== RARITY ENGINE =====================

function getRarity(){
    const r = Math.random();
    if(r < 0.60) return {name:"common", xp:10};
    if(r < 0.85) return {name:"rare", xp:25};
    if(r < 0.97) return {name:"epic", xp:60};
    return {name:"legendary", xp:120};
}

// ===================== BUILDING BLOCKS =====================

const verbs = {
    exploration: ["Go to", "Walk to", "Explore", "Visit", "Head towards"],
    social: ["Talk to", "Approach", "Start a conversation with", "Ask"],
    creativity: ["Write about", "Think of", "Create", "Design"],
    fitness: ["Walk for", "Move through", "Explore while walking through"]
};

const targets = {
    exploration: [
        "a place you usually ignore nearby",
        "a café you’ve never entered",
        "a street you’ve never properly walked down",
        "a quiet area in your local surroundings"
    ],
    social: [
        "a stranger and learn something about them",
        "a shop worker and ask a question",
        "someone new you’ve never spoken to"
    ],
    creativity: [
        "3 small improvements to your daily life",
        "a problem you currently have and 2 solutions",
        "a simple idea that could make life easier"
    ],
    fitness: [
        "for 10–15 minutes without distractions",
        "while noticing details you usually ignore",
        "at a steady pace without checking your phone"
    ]
};

// optional “twist modifiers” (adds variation without breaking logic)
const modifiers = [
    "",
    "only if it feels comfortable",
    "and reflect afterwards",
    "without rushing",
    "and take your time observing everything"
];

// ===================== CORE GENERATOR =====================

function buildMission(){

    const category = pick(Object.keys(verbs));
    const verb = pick(verbs[category]);
    const target = pick(targets[category]);
    const mod = pick(modifiers);

    let sentence = `${verb} ${target}`;

    if(mod) sentence += ` ${mod}`;

    return { text: sentence, category };
}

// ===================== ANTI-REPEAT SYSTEM =====================

function isRepeated(mission){
    return history.includes(mission.text);
}

// ===================== GENERATE =====================

function generate(){

    let mission;

    // keep trying until unique (prevents repetition)
    for(let i = 0; i < 20; i++){
        mission = buildMission();
        if(!isRepeated(mission)) break;
    }

    history.push(mission.text);

    // keep memory size controlled
    if(history.length > 80){
        history.shift();
    }

    localStorage.setItem("history", JSON.stringify(history));

    const rarity = getRarity();

    current = {
        text: mission.text,
        xp: rarity.xp,
        rarity: rarity.name
    };

    document.getElementById("challenge").innerText = current.text;

    document.getElementById("badge").innerHTML =
        `<span class="badge ${rarity.name}">
            ${rarity.name.toUpperCase()} +${rarity.xp} XP
        </span>`;
}

// ===================== LEVEL SYSTEM =====================

function updateLevel(){
    level = Math.floor(xp / 100) + 1;
    document.getElementById("level").innerText = level;
}

// ===================== COMPLETE =====================

function complete(){

    if(!current) return;

    xp += current.xp;
    localStorage.setItem("xp", xp);

    let last = localStorage.getItem("last");
    let today = new Date().toDateString();

    if(last !== today){
        streak++;
        localStorage.setItem("streak", streak);
        localStorage.setItem("last", today);
    }

    updateLevel();

    document.getElementById("xp").innerText = xp;
    document.getElementById("streak").innerText = streak;

    current = null;
    document.getElementById("challenge").innerText = "Quest Completed!";
    document.getElementById("badge").innerHTML = "";
}

</script>

</body>
</html>
