// ================= CATEGORY SYSTEM =================

const library = {
physicalMastery,
creativeOutput,
buildMissions,
skillAcquisition,
lifeUpgrade,
exploration,
perspectiveShift
};

const categoryNames = Object.keys(library);

// ================= ANTI-REPEAT (LIGHTWEIGHT BUT EFFECTIVE) =================

function getCategory(){

    let options = categoryNames.filter(c => !recentCategories.includes(c));

    if(options.length === 0){
        recentCategories = [];
        options = categoryNames;
    }

    const chosen = pick(options);

    recentCategories.push(chosen);

    if(recentCategories.length > 3){
        recentCategories.shift();
    }

    localStorage.setItem("recentCategories", JSON.stringify(recentCategories));

    return chosen;
}

// ================= GENERATE =================

function generate(){

    const category = getCategory();
    const mission = pick(library[category]);

    const key = category + mission;

    if(history.includes(key)){
        return generate();
    }

    history.push(key);

    if(history.length > 300){
        history.shift();
    }

    localStorage.setItem("history", JSON.stringify(history));

    document.getElementById("challenge").innerText =
`CATEGORY: ${category.toUpperCase()}

${mission}`;
}

// ================= COMPLETE =================

function complete(){

    total++;
    localStorage.setItem("total", total);

    let last = localStorage.getItem("last");
    let today = new Date().toDateString();

    if(last !== today){
        streak++;
        localStorage.setItem("streak", streak);
        localStorage.setItem("last", today);
    }

    document.getElementById("streak").innerText = streak;
    document.getElementById("total").innerText = total;
}

</script>
