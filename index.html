<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily Adventure Generator</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 90%;
    max-width: 500px;
    text-align: center;
}

.card {
    background: #1c1c1c;
    padding: 20px;
    border-radius: 15px;
    margin: 20px 0;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
}

button {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

.generate { background: #00c853; color: white; }
.complete { background: #2979ff; color: white; }
</style>
</head>

<body>

<div class="container">
    <h1>Daily Adventure</h1>

    <div class="card" id="challenge">Press generate</div>

    <button class="generate" onclick="generate()">Generate</button>
    <button class="complete" onclick="complete()">Complete</button>

    <p>Streak: <span id="streak">0</span></p>
    <p>Total: <span id="total">0</span></p>
</div>

<script>

// ===================== CORE DATA =====================

const actions = [
    "Explore",
    "Visit",
    "Find",
    "Discover",
    "Walk to",
    "Go to",
    "Look for",
    "Investigate",
    "Check out",
    "Head towards"
];

const objects = [
    "a place you’ve never noticed",
    "a local café",
    "a quiet street",
    "a nearby park",
    "a shop you’ve never entered",
    "a landmark nearby",
    "something unusual in your area",
    "a random interesting spot",
    "a place with lots of people",
    "a place with no people"
];

const contexts = [
    "near where you are now",
    "within walking distance",
    "without using transport",
    "in your local area",
    "you normally ignore",
    "you pass but never enter",
    "on your usual route"
];

const twists = [
    "",
    "and take note of 3 interesting things",
    "and try to notice something new",
    "and take a photo of something unusual",
    "and focus on details most people miss",
    "and change your normal route"
];

const endings = [
    "",
    "just for curiosity",
    "like you’re a tourist",
    "as if you’ve never been there before",
    "and reflect afterwards",
    "and stay observant"
];

// ===================== HELPERS =====================

function pick(arr){
    return arr[Math.floor(Math.random() * arr.length)];
}

// ===================== GENERATOR =====================

function generate(){

    const action = pick(actions);
    const object = pick(objects);
    const context = pick(contexts);
    const twist = pick(twists);
    const ending = pick(endings);

    let sentence = `${action} ${object} ${context}`;

    if(twist) sentence += ` ${twist}`;
    if(ending) sentence += ` ${ending}`;

    document.getElementById("challenge").innerText = sentence;
}

// ===================== COMPLETE =====================

let streak = parseInt(localStorage.getItem("streak") || "0");
let total = parseInt(localStorage.getItem("total") || "0");

document.getElementById("streak").innerText = streak;
document.getElementById("total").innerText = total;

function complete(){

    total++;
    localStorage.setItem("total", total);

    let last = localStorage.getItem("last");
    let today = new Date().toDateString();

    if(last !== today){
        streak++;
        localStorage.setItem("streak", streak);
        localStorage.setItem("last", today);
    }

    document.getElementById("streak").innerText = streak;
    document.getElementById("total").innerText = total;
}

</script>

</body>
</html>
